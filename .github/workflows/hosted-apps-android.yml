name: Build all Olamidepanel Android clients
on:
  push:
    branches: [main]
    paths: ['mobile/fleet/**', '.github/workflows/hosted-apps-android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hosted-apps-development
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Require stable signing secret
        env:
          KEYSTORE: ${{ secrets.HOSTED_APPS_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.HOSTED_APPS_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo 'Configure HOSTED_APPS_KEYSTORE_BASE64 and HOSTED_APPS_KEYSTORE_PASSWORD once. See mobile/fleet/README.md.'; exit 1; }
          test -n "$PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/hosted-apps.jks"
          chmod 600 "$RUNNER_TEMP/hosted-apps.jks"
      - name: Prepare domain artwork and resources
        run: python mobile/fleet/tools/prepare.py
      - name: Build all domain clients
        env:
          FLEET_KEYSTORE: ${{ runner.temp }}/hosted-apps.jks
          FLEET_KEY_PASSWORD: ${{ secrets.HOSTED_APPS_KEYSTORE_PASSWORD }}
          FLEET_KEY_ALIAS: hostedapps
          APP_VERSION_CODE: ${{ github.run_number }}
        run: gradle -p mobile/fleet :app:assembleDebug --no-daemon --max-workers=2
      - name: Validate and package APKs
        run: python mobile/fleet/tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-apps-websites
          path: mobile/fleet/dist/*
      - name: Publish verified files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hosted-apps-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" mobile/fleet/dist/* --prerelease --title "Hosted Android clients ${GITHUB_RUN_NUMBER}" --notes "Development website clients. Android 8+. See source README for capabilities and limitations."
          if ! gh release view hosted-apps-development >/dev/null 2>&1; then
            gh release create hosted-apps-development --prerelease --title 'Hosted Android clients — development' --notes 'Latest successfully built Android website clients.'
          fi
          gh release upload hosted-apps-development mobile/fleet/dist/* --clobber
