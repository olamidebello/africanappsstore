name: Build and publish Africa Weather Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/africaweather/**', 'catalog/africaweather.json', '.github/workflows/africaweather-android.yml']
permissions:
  contents: write
concurrency:
  group: africaweather-android
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up supported Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: mobile/africaweather
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon assembleDebug
      - name: Verify signature and package
        working-directory: mobile/africaweather
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AfricaWeather.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/AfricaWeather.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/AfricaWeather.apk > dist/package-info.txt
          grep -F "package: name='world.africandroid.africaweather'" dist/package-info.txt
          cd dist
          sha256sum AfricaWeather.apk > AfricaWeather.apk.sha256
      - name: Prepare app metadata
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          metadata=json.loads(Path('catalog/africaweather.json').read_text())
          apk=Path('mobile/africaweather/dist/AfricaWeather.apk')
          metadata.update(version=os.environ['APP_VERSION'],sha256=hashlib.sha256(apk.read_bytes()).hexdigest(),size_bytes=apk.stat().st_size)
          Path('mobile/africaweather/dist/africaweather.json').write_text(json.dumps(metadata,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AfricaWeather-Android
          path: mobile/africaweather/dist/*
      - name: Publish downloadable APK in African Apps Store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "africaweather-android-${{ github.run_number }}-${{ github.run_attempt }}" mobile/africaweather/dist/* --title "Africa Weather Android 1.0.${{ github.run_number }}" --notes "Africa Weather for Android 6+. Seven-day forecast website with 55 country editions and a saved country selector. Internet required. Debug-signed development APK; updates may require reinstalling. SHA-256 and package metadata included." --latest=false
