---
- name: Publish verified Africa Jobs Android download in existing Apps Store
  hosts: all
  become: true
  vars:
    jobs_store_source: /opt/africajobs-store-release
  tasks:
    - name: Pull source without discarding local edits
      ansible.builtin.git:
        repo: https://github.com/olamidebello/africanappsstore.git
        dest: '{{ jobs_store_source }}'
        version: main
        force: false
    - name: Verify APK checksum before installation
      ansible.builtin.command:
        argv: [sha256sum, -c, africa-jobs.apk.sha256]
        chdir: '{{ jobs_store_source }}/static/africajobs'
      changed_when: false
    - name: Deploy current store code and assets with existing backup mechanism
      ansible.builtin.command:
        argv: [python3, '{{ jobs_store_source }}/tools/update_store.py']
      register: store_update
      changed_when: "'UPDATED' in store_update.stdout"
    - name: Register verified Africa Jobs download
      ansible.builtin.command:
        argv: [python3, '{{ jobs_store_source }}/tools/install_africajobs.py']
      changed_when: true
    - name: Verify public HTTPS APK
      ansible.builtin.uri:
        url: https://africanappsstore.space/downloads/africa-jobs.apk
        method: HEAD
        validate_certs: true
        status_code: 200
    - name: Verify listing
      ansible.builtin.uri:
        url: https://africanappsstore.space/api/hosted-apps
        return_content: true
        validate_certs: true
      register: listings
      failed_when: "listings.status != 200 or 'jobs.africandroid.world' not in listings.content"
