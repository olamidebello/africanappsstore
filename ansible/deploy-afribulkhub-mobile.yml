---
- name: Publish Africa Bulk Hub Android release in existing African Apps Store
  hosts: all
  become: true
  vars:
    hub_store_source: /opt/afribulkhub-store-release
  tasks:
    - name: Pull current store source without discarding edits
      ansible.builtin.git:
        repo: https://github.com/olamidebello/africanappsstore.git
        dest: '{{ hub_store_source }}'
        version: main
        force: false
    - name: Verify APK before installation
      ansible.builtin.command:
        argv: [sha256sum, -c, africa-bulk-hub.apk.sha256]
        chdir: '{{ hub_store_source }}/static/afribulkhub'
      changed_when: false
    - name: Deploy store code and assets using existing backup and rollback mechanism
      ansible.builtin.command:
        argv: [python3, '{{ hub_store_source }}/tools/update_store.py']
      register: store_update
      changed_when: "'UPDATED' in store_update.stdout"
    - name: Register the verified download using the current store data location
      ansible.builtin.command:
        argv: [python3, '{{ hub_store_source }}/tools/install_afribulkhub.py']
      changed_when: true
    - name: Verify public HTTPS release files
      ansible.builtin.uri:
        url: 'https://africanappsstore.space{{ item }}'
        method: HEAD
        validate_certs: true
        status_code: 200
      loop: [/downloads/africa-bulk-hub.apk, /downloads/africa-bulk-hub.apk.sha256, /downloads/africa-bulk-hub-logo.png]
    - name: Verify public catalog listing
      ansible.builtin.uri:
        url: https://africanappsstore.space/api/hosted-apps
        return_content: true
        validate_certs: true
      register: catalog
      failed_when: catalog.status != 200 or 'afribulkhub.com' not in catalog.content
