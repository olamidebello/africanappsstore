---
- name: Pull, deploy and publish signed AIMS Android on existing Olamidepanel services
  hosts: all
  become: true
  vars:
    aims_store_source: /opt/aims-store-release
    aims_source: /opt/aims
  tasks:
    - name: Pull store source preserving local edits
      ansible.builtin.git:
        repo: https://github.com/olamidebello/africanappsstore.git
        dest: '{{ aims_store_source }}'
        version: main
        force: false
    - name: Verify signed artifact checksum
      ansible.builtin.command:
        argv: [sha256sum, -c, aims.apk.sha256]
        chdir: '{{ aims_store_source }}/static/aims'
      changed_when: false
    - name: Pull AIMS install page and APK
      ansible.builtin.git:
        repo: https://github.com/olamidebello/Africa-IMS.git
        dest: '{{ aims_source }}'
        version: main
        force: false
    - name: Deploy AIMS using dedicated socket and existing data
      ansible.builtin.command:
        argv: [ansible-playbook, -i, 'localhost,', -c, local, '{{ aims_source }}/ansible/deploy.yml']
    - name: Update existing Apps Store with backups and catalog integration
      ansible.builtin.command:
        argv: [python3, '{{ aims_store_source }}/tools/update_store.py']
      register: store_update
      changed_when: "'UPDATED' in store_update.stdout"
    - name: Verify AIMS install page
      ansible.builtin.uri:
        url: https://identity.africandroid.world/install
        return_content: true
        validate_certs: true
      register: install_page
      failed_when: "install_page.status != 200 or 'AIMS for Android' not in install_page.content"
    - name: Verify signed download on store
      ansible.builtin.uri:
        url: https://africanappsstore.space/downloads/aims.apk
        method: HEAD
        validate_certs: true
        status_code: 200
    - name: Verify hosted listing
      ansible.builtin.uri:
        url: https://africanappsstore.space/api/hosted-apps
        return_content: true
        validate_certs: true
      register: listings
      failed_when: "listings.status != 200 or 'identity.africandroid.world' not in listings.content"
