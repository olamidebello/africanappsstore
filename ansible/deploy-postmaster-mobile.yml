---
- name: Publish Postmaster Android release in existing African Apps Store
  hosts: all
  become: true
  vars:
    postmaster_store_source: /opt/postmaster-store-release
  tasks:
    - name: Pull current store source without discarding edits
      ansible.builtin.git:
        repo: https://github.com/olamidebello/africanappsstore.git
        dest: '{{ postmaster_store_source }}'
        version: main
        force: false
    - name: Verify APK before installation
      ansible.builtin.command:
        argv: [sha256sum, -c, postmaster.apk.sha256]
        chdir: '{{ postmaster_store_source }}/static/postmaster'
      changed_when: false
    - name: Deploy store code and assets using existing backup and rollback mechanism
      ansible.builtin.command:
        argv: [python3, '{{ postmaster_store_source }}/tools/update_store.py']
      register: store_update
      changed_when: "'UPDATED' in store_update.stdout"
    - name: Verify public HTTPS release files
      ansible.builtin.uri:
        url: 'https://africanappsstore.space{{ item }}'
        method: HEAD
        validate_certs: true
        status_code: 200
      loop: [/downloads/postmaster.apk, /downloads/postmaster.apk.sha256, /downloads/postmaster-logo.png]
    - name: Verify public catalog listing
      ansible.builtin.uri:
        url: https://africanappsstore.space/api/hosted-apps
        return_content: true
        validate_certs: true
      register: catalog
      failed_when: catalog.status != 200 or 'postmaster.justisolve.com' not in catalog.content
