# Reference these dedicated files INSIDE the corresponding existing Nginx
# HTTPS server blocks before running. Create them empty; do not reuse an
# existing website config file. Add every confirmed hosted domain here.
mobile_domain_includes:
  africanappsstore.space: /etc/nginx/mobile-apps/africanappsstore.space.conf
  africaweather.africandroid.world: /etc/nginx/mobile-apps/africaweather.africandroid.world.conf
  africaatona.africandroid.world: /etc/nginx/mobile-apps/africaatona.africandroid.world.conf
# Optional: false only for internal staging; defaults to true.
mobile_verify_https: true
